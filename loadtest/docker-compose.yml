# Load test mode: the stack with abuse limits lifted (all traffic comes from one load
# generator, so per-address limits would measure the limiter, not the system) and a
# Locust container. See docs/load-testing.md.
#
#   docker compose -f docker-compose.yml -f loadtest/docker-compose.yml up -d
#   docker compose -f docker-compose.yml -f loadtest/docker-compose.yml run --rm locust

services:
  nginx:
    environment:
      GATEWAY_RATE_LIMIT: 100000r/s
      GATEWAY_RATE_BURST: 100000

  catalog-api:
    environment:
      THROTTLE_AUTH_RATE: 100000/min
      # Locust reaches the gateway by its service name.
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,catalog-api,nginx

  booking-api:
    environment:
      SEARCH_RATE_LIMIT: 1000000/minute
      PUBLIC_RATE_LIMIT: 1000000/minute
      BOOKING_RATE_LIMIT: 1000000/minute

  locust:
    image: locustio/locust:2.42.0
    profiles: [loadtest]
    volumes:
      - ./loadtest:/mnt/locust
    environment:
      CHECKOUT_PUBLIC_URL: http://localhost:8090
      CHECKOUT_URL: http://payment-mock:8000
    command: >
      -f /mnt/locust/locustfile.py --host http://nginx --headless
      --users ${USERS:-200} --spawn-rate ${SPAWN_RATE:-20} --run-time ${RUN_TIME:-5m}
      --html /mnt/locust/results/report.html --csv /mnt/locust/results/run
    depends_on:
      - nginx
