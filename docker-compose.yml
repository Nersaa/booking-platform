name: booking-platform

x-catalog-env: &catalog-env
  DJANGO_SECRET_KEY: ${CATALOG_SECRET_KEY:?set in .env}
  DJANGO_DEBUG: ${CATALOG_DEBUG:-false}
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,catalog-api
  DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost
  DATABASE_URL: postgres://catalog:${CATALOG_DB_PASSWORD:?set in .env}@postgres:5432/catalog
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: amqp://${RABBITMQ_USER:?set in .env}:${RABBITMQ_PASSWORD:?set in .env}@rabbitmq:5672//
  JWT_PRIVATE_KEY_FILE: /var/lib/catalog/keys/jwt-private.pem
  S3_ENDPOINT_URL: http://object-storage:9000
  S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set in .env}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?set in .env}
  S3_BUCKET: listing-photos
  MEDIA_PUBLIC_BASE_URL: http://localhost/media
  EMAIL_HOST: mailpit
  EMAIL_PORT: 1025

x-catalog: &catalog
  image: booking-platform/catalog:local
  build:
    context: .
    dockerfile: services/catalog/Dockerfile
  environment: *catalog-env
  volumes:
    - jwt-keys:/var/lib/catalog/keys
  restart: unless-stopped

x-booking: &booking
  image: booking-platform/booking:local
  build:
    context: .
    dockerfile: services/booking/Dockerfile
  environment:
    DATABASE_URL: postgresql+asyncpg://booking:${BOOKING_DB_PASSWORD}@postgres:5432/booking
    RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
    JWKS_URL: http://catalog-api:8000/.well-known/jwks.json
    PAYMENT_PROVIDER_URL: http://payment-mock:8000
    PAYMENT_PROVIDER_API_KEY: ${PAYMENT_PROVIDER_API_KEY:?run python scripts/init_env.py}
    PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:?run python scripts/init_env.py}
  restart: unless-stopped

services:
  postgres:
    image: postgis/postgis:17-3.5-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD}
      BOOKING_DB_PASSWORD: ${BOOKING_DB_PASSWORD:?set in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/20-create-databases.sh:/docker-entrypoint-initdb.d/20-create-databases.sh:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 20
    restart: unless-stopped

  object-storage:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - object-storage-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  catalog-migrate:
    <<: *catalog
    command: >
      sh -c "python manage.py generate_jwt_keys --if-missing &&
             python manage.py ensure_storage &&
             python manage.py migrate --noinput"
    depends_on:
      postgres:
        condition: service_healthy
      object-storage:
        condition: service_healthy
    restart: "no"

  catalog-api:
    <<: *catalog
    depends_on:
      catalog-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  catalog-worker:
    <<: *catalog
    command: celery -A config worker --loglevel INFO --concurrency 2
    depends_on:
      catalog-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  catalog-beat:
    <<: *catalog
    command: celery -A config beat --loglevel INFO --schedule /tmp/celerybeat-schedule
    depends_on:
      rabbitmq:
        condition: service_healthy

  catalog-outbox-relay:
    <<: *catalog
    command: python manage.py relay_outbox
    depends_on:
      catalog-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  catalog-event-consumer:
    <<: *catalog
    command: python manage.py consume_events
    depends_on:
      catalog-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  booking-migrate:
    <<: *booking
    command: alembic upgrade head
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  booking-api:
    <<: *booking
    depends_on:
      booking-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  booking-worker:
    <<: *booking
    command: faststream run app.worker:app
    depends_on:
      booking-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  # Stand-in for a card payment provider; its checkout page is opened by the guest.
  payment-mock:
    image: booking-platform/payment-mock:local
    build:
      context: .
      dockerfile: services/payment-mock/Dockerfile
    environment:
      API_KEY: ${PAYMENT_PROVIDER_API_KEY}
      WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET}
      WEBHOOK_URL: http://booking-api:8000/api/v1/payments/webhook
      PUBLIC_URL: http://localhost:8090
    ports:
      - "127.0.0.1:8090:8000"
    restart: unless-stopped

  # Catches all outgoing email; web UI at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.29
    ports:
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      catalog-api:
        condition: service_healthy
      booking-api:
        condition: service_healthy
      object-storage:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  rabbitmq-data:
  object-storage-data:
  jwt-keys:
