name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff@0.17.3 check --output-format github .
      - run: uvx ruff@0.17.3 format --check .

  catalog:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/catalog
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: backend/catalog/uv.lock
      - run: uv sync --frozen
      - run: uv run --frozen mypy .
      - run: uv run --frozen python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings_test
          DATABASE_URL: "sqlite:///:memory:"
      # Tests start their own PostgreSQL through Testcontainers.
      - run: uv run --frozen pytest --cov --cov-report=term-missing

  booking:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/booking
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: backend/booking/uv.lock
      - run: uv sync --frozen
      - run: uv run --frozen mypy .
      # Tests start PostgreSQL + PostGIS and Redis through Testcontainers, apply the migrations
      # and check that they match the models.
      - run: uv run --frozen pytest --cov --cov-report=term-missing

  payment-mock:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/payment-mock
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: backend/payment-mock/uv.lock
      - run: uv sync --frozen
      - run: uv run --frozen mypy .
      - run: uv run --frozen pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build  # type-checks, then bundles

  # Pushes to main publish the images to GitHub Container Registry (tags: commit SHA and
  # latest). Pull requests only check that they build.
  images:
    needs: [lint, catalog, booking, payment-mock]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [catalog, booking, payment-mock]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Image name
        # Registry paths must be lowercase; the repository name may not be.
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.service }}" >> "$GITHUB_ENV"
      - if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: backend/${{ matrix.service }}/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
