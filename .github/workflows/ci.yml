name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff@0.17.3 check --output-format github .
      - run: uvx ruff@0.17.3 format --check .

  catalog:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/catalog
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: services/catalog/uv.lock
      - run: uv sync --frozen
      - run: uv run --frozen mypy .
      - run: uv run --frozen python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings_test
          DATABASE_URL: sqlite:///:memory:
      # Tests start their own PostgreSQL through Testcontainers.
      - run: uv run --frozen pytest --cov --cov-report=term-missing

  booking:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/booking
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: services/booking/uv.lock
      - run: uv sync --frozen
      - run: uv run --frozen mypy .
      # Tests start PostgreSQL + PostGIS through Testcontainers, apply the migrations
      # and check that they match the models.
      - run: uv run --frozen pytest --cov --cov-report=term-missing

  images:
    needs: [lint, catalog, booking]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [catalog, booking]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
