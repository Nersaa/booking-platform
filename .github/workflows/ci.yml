name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff@0.17.3 check --output-format github .
      - run: uvx ruff@0.17.3 format --check .

  catalog:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/catalog
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: services/catalog/uv.lock
      - run: uv sync --frozen
      - run: uv run --frozen mypy .
      - run: uv run --frozen python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings_test
          DATABASE_URL: "sqlite:///:memory:"
      # Tests start their own PostgreSQL through Testcontainers.
      - run: uv run --frozen pytest --cov --cov-report=term-missing

  booking:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/booking
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: services/booking/uv.lock
      - run: uv sync --frozen
      - run: uv run --frozen mypy .
      # Tests start PostgreSQL + PostGIS and Redis through Testcontainers, apply the migrations
      # and check that they match the models.
      - run: uv run --frozen pytest --cov --cov-report=term-missing

  payment-mock:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/payment-mock
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: services/payment-mock/uv.lock
      - run: uv sync --frozen
      - run: uv run --frozen mypy .
      - run: uv run --frozen pytest

  # Every push to main publishes the images to GitHub Container Registry, tagged with the
  # commit SHA and `latest`. Pull requests only build them.
  images:
    needs: [lint, catalog, booking, payment-mock]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false  # a broken image must not hide the state of the others
      matrix:
        service: [catalog, booking, payment-mock]
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Image name
        # Registry paths must be lowercase; the repository name may not be.
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.service }}" >> "$GITHUB_ENV"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.service }}
          # The cache only speeds builds up; a cache service hiccup must not fail one.
          cache-to: type=gha,mode=max,scope=${{ matrix.service }},ignore-error=true
