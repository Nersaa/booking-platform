upstream catalog {
    server catalog-api:8000;
}

upstream booking {
    server booking-api:8000;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Processed listing photos. The bucket only allows anonymous reads under public/.
    location /media/ {
        proxy_pass http://object-storage:9000/listing-photos/;
        proxy_set_header Host object-storage:9000;
        proxy_hide_header Set-Cookie;
        limit_except GET HEAD { deny all; }
    }

    # One public API, two services: availability and pricing belong to Booking.
    location ~ ^/api/v1/listings/[^/]+/(calendar|quote)$ {
        proxy_pass http://booking;
    }

    location ~ ^/api/v1/host/listings/[^/]+/(pricing|seasonal-rates|blocks)(/|$) {
        proxy_pass http://booking;
    }

    location /api/v1/bookings {
        proxy_pass http://booking;
    }

    location /api/v1/host/bookings {
        proxy_pass http://booking;
    }

    location /api/docs/booking/ {
        proxy_pass http://booking;
    }

    location /api/schema/booking/ {
        proxy_pass http://booking;
    }

    location / {
        proxy_pass http://catalog;
    }
}
