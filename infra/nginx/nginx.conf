# Docker's DNS. Addresses go into variables below, so Nginx looks them up again (at most
# every 10 s) instead of once at start: a recreated container with a new IP is found
# automatically.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 1m;

    set $catalog http://catalog-api:8000;
    set $booking http://booking-api:8000;
    set $storage http://object-storage:9000;
    set $frontend http://frontend:80;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Replace (not append to) what the client sent, so nobody can fake their address
    # to get around per-IP rate limits.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Metrics are scraped inside the Docker network only.
    location = /metrics {
        return 404;
    }

    # Processed listing photos. The bucket only allows anonymous reads under public/.
    location /media/ {
        rewrite ^/media/(.*)$ /listing-photos/$1 break;
        proxy_pass $storage;
        proxy_set_header Host object-storage:9000;
        proxy_hide_header Set-Cookie;
        limit_except GET HEAD { deny all; }
    }

    # Direct photo uploads from the browser: only presigned POSTs, which the storage
    # checks against the signed policy (key, type, size up to 10 MB).
    location /storage/ {
        rewrite ^/storage/(.*)$ /$1 break;
        proxy_pass $storage;
        proxy_set_header Host object-storage:9000;
        client_max_body_size 11m;
        limit_except POST { deny all; }
    }

    # One public API, two services. Search, availability and pricing belong to Booking;
    # the listing page and its reviews to Catalog.
    location = /api/v1/listings {
        proxy_pass $booking;
    }

    location ~ ^/api/v1/listings/[^/]+/(calendar|quote)$ {
        proxy_pass $booking;
    }

    location ~ ^/api/v1/host/listings/[^/]+/(pricing|seasonal-rates|blocks)(/|$) {
        proxy_pass $booking;
    }

    location /api/v1/bookings {
        proxy_pass $booking;
    }

    location /api/v1/host/bookings {
        proxy_pass $booking;
    }

    location = /api/v1/host/stats {
        proxy_pass $booking;
    }

    location /api/docs/booking/ {
        proxy_pass $booking;
    }

    location /api/schema/booking/ {
        proxy_pass $booking;
    }

    # The rest of the API, the admin with its static files and JWKS belong to Catalog.
    location /api/ {
        proxy_pass $catalog;
    }

    location /admin {
        proxy_pass $catalog;
    }

    location /static/ {
        proxy_pass $catalog;
    }

    location /.well-known/ {
        proxy_pass $catalog;
    }

    # The website (React app).
    location / {
        proxy_pass $frontend;
    }
}
