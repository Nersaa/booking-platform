# Prometheus scrapes the services inside the Docker network; /metrics is not reachable
# through the public gateway.
global:
  scrape_interval: 10s

scrape_configs:
  - job_name: catalog-api
    static_configs:
      - targets: ["catalog-api:8000"]

  - job_name: booking-api
    static_configs:
      - targets: ["booking-api:8000"]

  # Built-in plugin of the RabbitMQ image: messages waiting in every queue.
  - job_name: rabbitmq
    metrics_path: /metrics/detailed
    params:
      family: [queue_coarse_metrics]
    static_configs:
      - targets: ["rabbitmq:15692"]
