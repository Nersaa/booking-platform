# Scrapes every process of the platform inside the Docker network. Nothing here is
# reachable through the public gateway.
global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: catalog-api
    static_configs:
      - targets: ["catalog-api:8000"]

  - job_name: catalog-outbox-relay
    static_configs:
      - targets: ["catalog-outbox-relay:9100"]

  - job_name: catalog-event-consumer
    static_configs:
      - targets: ["catalog-event-consumer:9100"]

  - job_name: booking-api
    static_configs:
      - targets: ["booking-api:8000"]

  - job_name: booking-worker
    static_configs:
      - targets: ["booking-worker:9100"]

  # Built-in plugin of the RabbitMQ image; per-queue depth for the event pipeline.
  - job_name: rabbitmq
    metrics_path: /metrics/detailed
    params:
      family: [queue_coarse_metrics, queue_consumer_count]
    static_configs:
      - targets: ["rabbitmq:15692"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
