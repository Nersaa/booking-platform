target-version = "py313"
line-length = 100
extend-exclude = ["**/migrations/**"]

[lint]
select = [
    "E", "W", "F", "I", "B", "UP", "N", "S", "C4", "DJ", "DTZ",
    "PT", "PTH", "RET", "SIM", "RUF",
]
# Django/DRF declare configuration as mutable class attributes by design.
ignore = ["RUF012"]

[lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106"]

[lint.isort]
known-first-party = ["apps", "config"]
