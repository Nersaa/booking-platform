target-version = "py313"
line-length = 100
extend-exclude = ["**/migrations/**"]

[lint]
select = [
    "E", "W", "F", "I", "B", "UP", "N", "S", "C4", "DJ", "DTZ",
    "PT", "PTH", "RET", "SIM", "RUF",
]
# Django/DRF declare configuration as mutable class attributes by design.
ignore = ["RUF012"]

[lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106"]
# Random demo and load data is not cryptography; the seeder calls the local docker CLI and
# the local gateway only.
"loadtest/**" = ["S310", "S311", "S603", "S607"]
"**/commands/seed_listings.py" = ["S311"]

[lint.isort]
known-first-party = ["app", "apps", "config", "tests"]
