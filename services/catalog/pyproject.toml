[project]
name = "catalog"
version = "0.1.0"
description = "Catalog service: identity, listings, photos, moderation"
requires-python = ">=3.13"
dependencies = [
    "argon2-cffi>=23.1",
    "boto3>=1.35",
    "booking-contracts",
    "celery>=5.5",
    "django>=5.2,<6.0",
    "django-environ>=0.12",
    "django-filter>=25.1",
    "django-stubs-ext>=5.2",
    "djangorestframework>=3.16",
    "djangorestframework-simplejwt[crypto]>=5.5",
    "drf-spectacular>=0.28",
    "gunicorn>=23.0",
    "pillow>=11.3",
    "psycopg[binary]>=3.2",
    "redis>=5.2",
    "whitenoise>=6.9",
]

[dependency-groups]
dev = [
    "django-stubs[compatible-mypy]>=5.2",
    "djangorestframework-stubs[compatible-mypy]>=3.16",
    "boto3-stubs[s3]>=1.35",
    "celery-types>=0.23",
    "factory-boy>=3.3",
    "moto[s3]>=5.1",
    "pytest>=8.4",
    "pytest-cov>=6.2",
    "pytest-django>=4.11",
    "testcontainers[postgres]>=4.10",
]

[tool.uv]
package = false

[tool.uv.sources]
booking-contracts = { path = "../../libs/contracts", editable = true }

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["apps", "config"]
omit = ["*/migrations/*"]

[tool.mypy]
python_version = "3.13"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
exclude = ['migrations/', '\.venv/']

[[tool.mypy.overrides]]
module = ["environ", "factory", "factory.*", "testcontainers.*", "moto"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.django-stubs]
django_settings_module = "config.settings_test"
