[project]
name = "booking"
version = "0.1.0"
description = "Booking service: availability, pricing and bookings"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16",
    "asyncpg>=0.30",
    "booking-contracts",
    "fastapi>=0.116",
    "faststream[cli,rabbit]>=0.6",
    "httpx>=0.28",
    "pydantic-settings>=2.10",
    "pyjwt[crypto]>=2.10",
    "sqlalchemy[asyncio]>=2.0.41",
    "uvicorn[standard]>=0.35",
]

[dependency-groups]
dev = [
    "mypy>=1.17",
    "pytest>=8.4",
    "pytest-asyncio>=1.1",
    "pytest-cov>=6.2",
    "testcontainers[postgres]>=4.10",
]

[tool.uv]
package = false

[tool.uv.sources]
booking-contracts = { path = "../../libs/contracts", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.coverage.run]
source = ["app"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
exclude = ['\.venv/']

[[tool.mypy.overrides]]
module = ["testcontainers.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
