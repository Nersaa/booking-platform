server {
    listen 80;
    root /usr/share/nginx/html;

    # Files built by Vite have a hash in their names, so they can be cached for long.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Any other path is a page of the single-page app: React Router shows the right one.
    location / {
        try_files $uri /index.html;
    }
}
